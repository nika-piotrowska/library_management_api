plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-factory_bot

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  TargetRailsVersion: 8.1

  Exclude:
    - "db/schema.rb"
    - "vendor/**/*"
    - "tmp/**/*"
    - "log/**/*"
    - "bin/**/*"

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'db/migrate/**/*'
    - 'config/routes.rb'

Metrics/MethodLength:
  Max: 15
  Exclude:
    - 'db/migrate/**/*'
    - 'spec/**/*'

Layout/LineLength:
  Max: 120

Style/Documentation:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 3

RSpec/ExampleLength:
  Enabled: false
